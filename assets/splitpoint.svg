span> src/crop.py</text><rect x="936" y="148" width="220" height="28" rx="7" fill="#2a3150" fill-opacity=".55" stroke="#2a3150" stroke-opacity="0"/><text x="948" y="167" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#e8ecf8"><tspan fill="#98a3c2">view</tspan> src/crop.py</text><path d="M880 162H936" stroke="#5d6788" stroke-dasharray="2 4"/><rect x="660" y="184" width="220" height="28" rx="7" fill="#2a3150" fill-opacity=".55" stroke="#2a3150" stroke-opacity="0"/><text x="672" y="203" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#e8ecf8"><tspan fill="#98a3c2">test</tspan> test_crop.py</text><rect x="936" y="184" width="220" height="28" rx="7" fill="#2a3150" fill-opacity=".55" stroke="#2a3150" stroke-opacity="0"/><text x="948" y="203" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#e8ecf8"><tspan fill="#98a3c2">test</tspan> test_crop.py</text><path d="M880 198H936" stroke="#5d6788" stroke-dasharray="2 4"/><rect x="660" y="220" width="220" height="28" rx="7" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf" stroke-opacity=".9"/><text x="672" y="239" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#e8ecf8"><tspan fill="#98a3c2">edit</tspan> src/crop.py</text><rect x="936" y="220" width="220" height="28" rx="7" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".9"/><text x="948" y="239" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#e8ecf8"><tspan fill="#98a3c2">edit</tspan> utils/io.py</text><rect x="660" y="256" width="220" height="28" rx="7" fill="#1f3a3a" fill-opacity=".55" stroke="#1f3a3a" stroke-opacity="0"/><text x="672" y="275" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#9fd