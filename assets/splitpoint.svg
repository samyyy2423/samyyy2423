<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Splitpoint: finds where a failing coding-agent run split from a passing one">
  <style>@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}.pulse{animation:p 1.8s ease-in-out infinite}</style>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a38"/>
    </linearGradient>
    <radialGradient id="fga"><stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="fgb"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".20"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <pattern id="fgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="fclip"><rect width="1200" height="350" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="1200" height="350" fill="url(#fbg)"/>
    <rect width="1200" height="350" fill="url(#fgrid)"/>
    <circle cx="144" cy="0" r="384" fill="url(#fga)"/>
    <circle cx="1080" cy="350" r="408" fill="url(#fgb)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="349" rx="22" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <text x="48" y="54" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#fbbf24">★ FEATURED · samyyy2423/splitpoint</text>
  <text x="46" y="104" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#e8ecf8">Splitpoint</text>
  <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#98a3c2"><tspan x="48" y="150">Where did the failing agent run go wrong?</tspan><tspan x="48" y="178">Splitpoint lines up a passing and a failing SWE-</tspan><tspan x="48" y="206">agent run on the same task, finds the step where</tspan><tspan x="48" y="234">they split, and has an LLM judge explain why,</tspan><tspan x="48" y="262">scored against blind human labels.</tspan></text>
  <rect x="48" y="288" width="74" height="28" rx="14.0" fill="#2dd4bf" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/><text x="85" y="306.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#2dd4bf">Python</text><rect x="132.36" y="288" width="74" height="28" rx="14.0" fill="#2dd4bf" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/><text x="170" y="306.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#2dd4bf">DuckDB</text><rect x="216.72000000000003" y="288" width="155" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="294" y="306.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#a78bfa">Needleman–Wunsch</text><rect x="381.68000000000006" y="288" width="99" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45"/><text x="431" y="306.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#fbbf24">LLM judge</text><rect x="490.2200000000001" y="288" width="82" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="531" y="306.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#a78bfa">Next.js</text>
